services:
    mongodb:
        image: mongo:7.0
        container_name: dashboard-mongodb-dev
        restart: unless-stopped
        volumes:
            - mongo-data:/data/db
        ports:
            - '5000:27017'
        command: ['--bind_ip_all']

    minio:
        image: minio/minio:latest
        container_name: dashboard-minio-dev
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        volumes:
            - minio-data:/data
        ports:
            - '5001:9000'
            - '5002:9001'

volumes:
    mongo-data:
    minio-data:
